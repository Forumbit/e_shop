name: e_shop
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  go_router: ^16.1.0
  flutter_screenutil: ^5.9.0
  freezed_annotation: ^2.3.0
  json_annotation: ^4.9.0
  dio: ^5.3.2
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  email_validator: ^3.0.0
  logger: ^2.1.0
  # firebase_core: ^2.23.0
  # firebase_auth: ^4.10.0
  # google_sign_in: ^7.2.0
  # cloud_firestore: ^4.17.5
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  build_runner: ^2.5.0
  freezed: ^2.3.0

  json_serializable: ^6.8.0

  # app icon & splash screen
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito/Nunito-Bold.ttf
          weight: 700
    - family: "Manrope"
      fonts:
        - asset: assets/fonts/Nunito/Manrope/Manrope-Regular.ttf
        - asset: assets/fonts/Nunito/Manrope/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Nunito/Manrope/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Nunito/Manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito/Manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito/Manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito/Manrope/Manrope-ExtraBold.ttf
          weight: 800
